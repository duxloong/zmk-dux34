# dux34 Configuration

# Required: Allow P0.09 and P0.10 (NFC pins) to be used as regular GPIO
# col8 = D8 (P0.10), col9 = D9 (P0.09)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Bluetooth TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ─── RGB LED Battery Indicator ─────────────────────────────────
# WS2812 addressable LED on D1 (P0.06) via SPI3
# Provides: low battery (red flash), charging (yellow breathe), full (green solid)

# LED Strip hardware driver
CONFIG_LED_STRIP=y

# WS2812 via SPI backend (SPIM3 + D1 data line)
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Battery state-of-charge reporting (fires zmk_battery_state_changed events)
CONFIG_ZMK_BATTERY_REPORTING=y

# USB connection events (fires zmk_usb_conn_state_changed to detect charging)
CONFIG_ZMK_USB=y
