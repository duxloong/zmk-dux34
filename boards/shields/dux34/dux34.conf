# dux34 Configuration

# Required: Allow P0.09 and P0.10 (NFC pins) to be used as regular GPIO
# col8 = D8 (P0.10), col9 = D9 (P0.09)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Bluetooth TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ─── RGB LED Battery Indicator ─────────────────────────────────
# WS2812 addressable LED on D1 (P0.06) via SPI3
# Logic: charging→yellow breathe, full→green solid, low batt→red flash

# SPI bus driver（必须显式启用：WS2812_STRIP_SPI 依赖 SPI，但不会自动 select）
CONFIG_SPI=y

# LED Strip 底层驱动（WS2812 SPI 后端）
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# ZMK RGB Underglow 子系统（负责 WS2812 设备实例化 + 提供 zmk_rgb_underglow_* API）
# battery_rgb_indicator.c 通过此 API 控制颜色和效果
CONFIG_ZMK_RGB_UNDERGLOW=y

# 禁用空闲自动熄灭：电池指示灯需要在键盘静止时也能显示
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# 禁用 USB 断开自动熄灭：低电量报警时不能因断 USB 就熄灭
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Battery state-of-charge reporting（触发 zmk_battery_state_changed 事件）
CONFIG_ZMK_BATTERY_REPORTING=y

# USB connection events（触发 zmk_usb_conn_state_changed，用于检测充电状态）
CONFIG_ZMK_USB=y
