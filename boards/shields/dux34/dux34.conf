# 开启 RGB 功能
CONFIG_ZMK_RGB_UNDERGLOW=y

# 必须：开启 Zephyr 的 PWM 驱动支持
CONFIG_PWM=y

# 必须：开启基于 PWM 的 LED 灯条驱动
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# 低电量（小于20%）亮红灯配置（保持之前的配置）
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BAT_LVL_IND=y
CONFIG_ZMK_RGB_UNDERGLOW_BAT_LVL_CRITICAL_TRSH=20