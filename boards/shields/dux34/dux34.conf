# ============================================================
# WS2812 RGB LED 电池状态指示配置
# D1 (P0.06) 连接单颗 WS2812：
#   黄灯 = 充电中 (USB 已插入, 电量 < 100%)
#   蓝灯 = 充满   (USB 已插入, 电量 = 100%)
#   红灯 = 低电量 (USB 未插入, 电量 < 20%)
#   熄灭 = 正常使用
# ============================================================

# SPI 总线（WS2812 驱动需要）
CONFIG_SPI=y

# LED Strip 驱动
CONFIG_LED_STRIP=y

# WS2812 SPI 驱动
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# 电池电量上报（获取 state_of_charge 事件）
CONFIG_ZMK_BATTERY_REPORTING=y

# USB 状态检测（用于判断充电状态）
CONFIG_ZMK_USB=y

# 自定义 LED 状态 widget（本 shield 的 C 实现）
CONFIG_DUX34_LED_WIDGET=y
