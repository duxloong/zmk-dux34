# ============================================================
# WS2812 RGB LED 电池状态指示配置
# D1 (P0.06, SPI3 MOSI) 连接单颗 WS2812：
#   黄灯 = 充电中 (USB 已插入, 电量 < 100%)
#   蓝灯 = 充满   (USB 已插入, 电量 = 100%)
#   红灯 = 低电量 (USB 未插入, 电量 < 20%)
#   熄灭 = 正常使用
# ============================================================

# SPI 总线（WS2812 驱动需要）
CONFIG_SPI=y

# LED Strip 驱动
CONFIG_LED_STRIP=y

# WS2812 SPI 驱动
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# 电池电量上报（获取 state_of_charge 事件；nice_nano_v2 默认已启用，此处确保开启）
CONFIG_ZMK_BATTERY_REPORTING=y

# 自定义 LED 状态 widget
CONFIG_DUX34_LED_WIDGET=y
